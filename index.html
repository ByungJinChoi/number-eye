<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>XROBO BLE — Digit OCR Edition (수정 버전)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<script src="https://unpkg.com/blockly/blockly.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
/* === 전체화면: 카메라만 보이게 하는 스타일 === */
#playOverlay .body{
  display:flex;
  height:100%;
}
#playOverlay video#eyesCam{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  transform: scaleX(-1);
}
#playOverlay .ov-right-panel{
  display:none !important;
}

/* 숫자 배지 (전체화면) */
#playOverlay #overlayDigitBadge{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:10001;
  display:none;
  font:700 14px/1 system-ui;
  color:#fff;
  padding:.5rem .8rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
}
#playOverlay #overlayDigitBadge .value{
  font:900 18px/1.1 ui-monospace, Menlo, Consolas, monospace;
  padding:2px 8px;
  border-radius:8px;
  background:rgba(255,255,255,.12);
  box-shadow:0 0 0 2px rgba(255,255,255,.18) inset;
}

/* focusBox / eyesStage 숨김 (전체 화면 인식은 ROI 없이 전체 화면 기준) */
#focusBox{display:none !important;}
#eyesStage{display:none !important;}

:root{
  --pad:10px;
  --uiScale:1;
  --headerH:64px;
  --btnH:36px;
  --gap:8px;
  --headerBgTop:#fff7ed;
  --headerBgBottom:#fffbeb;
  --headerBorder:#fed7aa;
  --logH:180px;
  --blue:#1d4ed8;

  --handleWBase:22;
  --handleHBase:28;
  --triWBase:14;
  --triHBase:12;

  --handleW:calc(var(--handleWBase)*var(--uiScale)*1px);
  --handleH:calc(var(--handleHBase)*var(--uiScale)*1px);
  --triW:calc(var(--triWBase)*var(--uiScale)*1px);
  --triH:calc(var(--triHBase)*var(--uiScale)*1px);
  --linkBar:calc(3*var(--uiScale)*1px);

  --keyW:clamp(52px,8vmin,92px);
  --keyH:calc(var(--keyW)*2.7);
  --keyGap:6px;
  --keyFont:14px;

  --eyesGap:8vmin;
  --eyeSize:42vmin;
  --pupilSize:16vmin;
  --blinkSpeed:180ms;
}
@media(max-width:480px){
  :root{ --keyGap:4px; --keyFont:13px; }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;}

/* 헤더 */
header{
  padding:8px 12px;
  background:linear-gradient(180deg,var(--headerBgTop),var(--headerBgBottom));
  border-bottom:1px solid var(--headerBorder);
  position:relative;z-index:10;
}
#topbar{
  display:flex;align-items:center;
  gap:calc(var(--gap)*var(--uiScale));
  flex-wrap:wrap;
}
.title{
  font-weight:800;letter-spacing:.2px;
  color:#7c2d12;margin-right:12px;
  font-size:calc(18px*var(--uiScale));
}
.spacer{flex:1 1 auto;}
.btn{
  height:calc(var(--btnH)*var(--uiScale));
  padding:0 calc(12px*var(--uiScale));
  border:0;border-radius:calc(10px*var(--uiScale));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:calc(14px*var(--uiScale));font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  background:#f3f4f6;color:#111827;cursor:pointer;
  user-select:none;
}
.btn.small{
  height:calc(var(--btnH)*var(--uiScale)*.85);
  padding:0 calc(10px*var(--uiScale));
  font-size:calc(12px*var(--uiScale));
}
#connectToggle{background:#2563eb;color:#fff;}
#testBtn{background:#0ea5e9;color:#fff;}
#runToggle{background:#16a34a;color:#fff;}
#fsBtn{background:#111827;color:#fff;}

.state{
  display:inline-flex;align-items:center;
  gap:calc(6px*var(--uiScale));
  height:calc(var(--btnH)*var(--uiScale));
  padding:0 calc(6px*var(--uiScale));
  font-size:calc(12px*var(--uiScale));
}
.badgeDot{
  width:calc(22px*var(--uiScale));
  height:calc(22px*var(--uiScale));
  border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:calc(11px*var(--uiScale));
  font-weight:800;color:#fff;
  box-shadow:0 0 0 calc(4px*var(--uiScale)) rgba(0,0,0,.06) inset;
}
.badgeDot.on{background:#3b82f6;}
.badgeDot.off{background:#ef4444;}

/* 레이아웃 */
#main{display:flex;width:100%;height:calc(100vh - var(--headerH));}
#left{position:relative;flex:1 1 auto;min-width:0;height:100%;display:flex;overflow:visible;}
#blocklyDiv{flex:1 1 auto;min-width:0;height:100%;width:100%;}

#right{
  flex:0 0 40%;display:flex;flex-direction:column;background:#fff;
  margin:8px 8px 8px 0;border:1px solid #e5e7eb;border-left:3px solid var(--blue);
  border-radius:12px 0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.04);
  overflow:hidden;position:relative;
}

/* 우측 상단 카메라 */
#rightTop{
  flex:1 1 auto;border-bottom:1px solid #e5e7eb;
  min-height:120px;background:#0b0f14;color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:0;overflow:hidden;
}
.camWrap{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
#camVideo{
  width:100%;height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  background:#000;
}
.camUi{
  position:absolute;right:12px;top:12px;
  display:flex;gap:8px;align-items:center;z-index:2;
}
.camBadge{
  font:700 12px/1 system-ui;color:#fff;
  padding:.35rem .6rem;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
}

/* 카메라 숫자 읽기 배지(코딩 화면) */
#digitReadout{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:12px;z-index:2;
  display:inline-flex;align-items:center;gap:.55rem;
  font:800 13px/1 system-ui;color:#fff;
  padding:.48rem .8rem;border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
}
#digitReadout .value{
  font:900 18px/1.1 ui-monospace,Menlo,Consolas,monospace;
  padding:2px 8px;border-radius:8px;
  background:rgba(255,255,255,.12);
  box-shadow:0 0 0 2px rgba(255,255,255,.18) inset;
}

/* 로그 패널 분할 바 */
#rightDivider{
  flex:0 0 6px;
  cursor:row-resize;
  background:repeating-linear-gradient(90deg,#d1d5db 0,#d1d5db 6px,#e5e7eb 6px,#e5e7eb 12px);
}

/* 로그 패널 */
#rightBottom{
  flex:0 0 var(--logH);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  padding:calc(10px*var(--uiScale));
  background:#0b0f14;color:#d1e4ff;border-top:1px solid #1f2937;
}
#log{
  flex:1 1 0;min-height:0;overflow:auto;
  white-space:pre-wrap;
  background:#0b0f14;border:1px solid #1f2937;
  border-radius:calc(8px*var(--uiScale));
  padding:calc(10px*var(--uiScale));
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:calc(12px*var(--uiScale));
  color:#d1e4ff;
}

/* 패널 핸들 (현재는 숨김 처리) */
#panelHandle{
  position:absolute;top:calc(12px*var(--uiScale));right:0;
  z-index:999;width:var(--handleW);height:var(--handleH);
  background:var(--blue);border:0;border-radius:calc(6px*var(--uiScale));
  box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;padding:0;
}
#panelHandle::before{
  content:'';position:absolute;top:0;right:calc(0px - var(--linkBar));
  width:var(--linkBar);height:100%;background:var(--blue);
  border-top-right-radius:calc(6px*var(--uiScale));
  border-bottom-right-radius:calc(6px*var(--uiScale));
}
#panelHandle::after{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:0;height:0;border-style:solid;
}
#panelHandle.open::after{
  left:calc((var(--handleW)-var(--triW))/2);
  border-width:var(--triH) 0 var(--triH) var(--triW);
  border-color:transparent transparent transparent white;
}
#panelHandle.closed::after{
  left:calc((var(--handleW)-var(--triW))/2);
  border-width:var(--triH) var(--triW) var(--triH) 0;
  border-color:transparent white transparent transparent;
}
.blocklyZoom,.blocklyTrash{display:block !important;}
.blocklyTrashLid,.blocklyTrashcanLid,.blocklyTrashCanLid{display:none !important;}

body.fs-active #main{height:calc(100vh - var(--headerH));}
body.panel-collapsed #right{display:none;}
body.panel-collapsed #left{flex:1 1 100%;}

/* 전체화면 오버레이 */
#playOverlay{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:none;
  z-index:10000;
  touch-action:none;
  overscroll-behavior:contain;
  -webkit-tap-highlight-color:transparent;
}
#playOverlay.show{
  display:flex;
  flex-direction:column;
}
#playOverlay .body{
  flex:1 1 auto;
}

/* 파일 드롭다운 */
.dropdown{position:relative;}
.dropdown .menu{
  position:absolute;right:0;top:calc(100% + 4px);
  display:none;min-width:140px;
  background:#ffffff;border:1px solid #d1d5db;border-radius:8px;
  box-shadow:0 6px 16px rgba(0,0,0,.12);padding:6px;z-index:1000;
}
.dropdown .menu.show{display:block;}
.dropdown .menu>button{
  width:100%;background:transparent;border:0;cursor:pointer;
  padding:8px 10px;border-radius:6px;
  font-size:calc(13px*var(--uiScale));
  text-align:left;color:#111827;
}
.dropdown .menu>button:hover{background:#f3f4f6;}
#fileBtn{background:#6b7280;color:#fff;}
</style>

<!-- 좌우 분할 조절바 -->
<style id="xrobo-hsplit-style">
:root{--rightW:40%;}
#hResizer{
  flex:0 0 8px;
  background:linear-gradient(90deg,#e5e7eb,#d1d5db);
  border-left:1px solid #cbd5e1;
  border-right:1px solid #cbd5e1;
  cursor:col-resize;
  touch-action:none;
  margin:8px 0;
}
body.hs-resizing,body.hs-resizing *{
  cursor:col-resize !important;
  user-select:none !important;
}
#right{
  flex:0 0 var(--rightW) !important;
  width:var(--rightW) !important;
  min-width:0 !important;
}
</style>

<!-- 기존 패널 핸들 숨김 -->
<style id="single-change-hide-handle">
#panelHandle{display:none !important;}
</style>

<!-- 안드로이드용 숫자 키패드 스타일 -->
<style id="xrobo-kp4x4-v14-style">
:root{--xroboKpScale:.7;}
#xrobo-kp4x4-v14{
  position:absolute;left:0;top:0;display:none;z-index:2147483647;
  background:#000;border:2px solid #000;
  border-radius:calc(16px*var(--xroboKpScale));
  padding:calc(12px*var(--xroboKpScale));
  box-shadow:0 16px 46px rgba(0,0,0,.45);
  user-select:none;touch-action:manipulation;
}
#xrobo-kp4x4-v14.show{display:block;}
#xrobo-kp4x4-v14 .display{
  margin-bottom:calc(10px*var(--xroboKpScale));
  background:#0b0f14;color:#e5e7eb;
  border:1px solid #1f2937;
  border-radius:calc(10px*var(--xroboKpScale));
  padding:calc(10px*var(--xroboKpScale)) calc(12px*var(--xroboKpScale));
  font-weight:800;
  font-size:calc(18px*var(--xroboKpScale));
  letter-spacing:.6px;
  min-height:24px;
}
#xrobo-kp4x4-v14 .grid{
  display:grid;
  grid-template-columns:repeat(4,calc(56px*var(--xroboKpScale)));
  grid-auto-rows:calc(56px*var(--xroboKpScale));
  gap:calc(10px*var(--xroboKpScale));
}
#xrobo-kp4x4-v14 button{
  border:0;
  border-radius:calc(12px*var(--xroboKpScale));
  background:#fff;color:#111;
  font-weight:900;font-size:calc(20px*var(--xroboKpScale));
  box-shadow:0 calc(4px*var(--xroboKpScale)) calc(14px*var(--xroboKpScale)) rgba(0,0,0,.22);
  cursor:pointer;
}
#xrobo-kp4x4-v14 button:active{transform:translateY(1px);}
#xrobo-kp4x4-v14 .op{background:#e6eefc;color:#0b3aa6;font-weight:800;}
#xrobo-kp4x4-v14 .back{background:#111827;color:#fff;font-size:calc(18px*var(--xroboKpScale));}
#xrobo-kp4x4-v14 .clear{background:#e5e7eb;color:#111827;font-size:calc(16px*var(--xroboKpScale));font-weight:800;}
#xrobo-kp4x4-v14 .wide{grid-column:span 2;height:calc(56px*var(--xroboKpScale));font-size:calc(18px*var(--xroboKpScale));font-weight:800;}
#xrobo-kp4x4-v14 .ok{background:#2563eb;color:#fff;}
#xrobo-kp4x4-v14 .cancel{background:#6b7280;color:#fff;}
</style>
</head>

<body>
<header id="appHeader">
  <div id="topbar">
    <div class="title">XROBO v3 — 숫자 인식</div>
    <div class="spacer"></div>

    <div class="dropdown" id="fileDropdown">
      <button id="fileBtn" class="btn" title="파일">파일 ▾</button>
      <div id="fileMenu" class="menu" role="menu" aria-hidden="true">
        <button data-cmd="new" role="menuitem">새로만들기</button>
        <button data-cmd="save" role="menuitem">저장하기</button>
        <button data-cmd="load" role="menuitem">불러오기</button>
      </div>
    </div>

    <span class="state">
      <span id="statusDot" class="badgeDot off">off</span>
    </span>

    <button id="connectToggle" class="btn">연결</button>
    <button id="testBtn" class="btn" title="코딩 화면에서 테스트 실행">테스트</button>
    <button id="runToggle" class="btn" title="전체화면 실행">실행</button>
    <button id="fsBtn" class="btn" title="전체화면">전체화면</button>
  </div>
</header>

<div id="main">
  <div id="left">
    <div id="blocklyDiv"></div>
    <button id="panelHandle" class="open" title="실행창 닫기"></button>
  </div>

  <div id="hResizer" class="hsplit" title="좌우 크기 조절 바"></div>

  <div id="right">
    <div id="rightTop">
      <div class="camWrap" id="camWrap">
        <video id="camVideo" playsinline autoplay muted></video>
        <div class="camUi">
          <span id="camBadge" class="camBadge">Cam: off</span>
          <button id="camToggle" class="btn small">캠 켜기</button>
        </div>
        <div id="digitReadout">
          <span class="label">숫자</span>
          <span class="value">—</span>
        </div>
      </div>
    </div>
    <div id="rightDivider" title="드래그하여 로그 높이 조절"></div>
    <div id="rightBottom">
      <div style="font-size:calc(12px*var(--uiScale));color:#9ca3af;">실행 로그</div>
      <div id="log"></div>
    </div>
  </div>
</div>

<!-- 블록 툴박스 -->
<xml id="toolbox" style="display:none">
  <category name="이벤트" colour="#f59e0b">
    <block type="xrobo_start"></block>
  </category>
  <category name="출력" colour="#60a5fa">
    <block type="motor12_dd">
      <field name="M1">20</field>
      <field name="M2">20</field>
      <field name="MS">500</field>
    </block>
    <block type="motor12_in">
      <value name="M1">
        <shadow type="math_number"><field name="NUM">20</field></shadow>
      </value>
      <value name="M2">
        <shadow type="math_number"><field name="NUM">20</field></shadow>
      </value>
      <value name="MS">
        <shadow type="math_number"><field name="NUM">500</field></shadow>
      </value>
    </block>
    <block type="melody">
      <field name="PITCH">C4</field>
      <value name="DUR">
        <shadow type="math_number"><field name="NUM">200</field></shadow>
      </value>
      <value name="WAIT">
        <shadow type="math_number"><field name="NUM">0</field></shadow>
      </value>
    </block>
    <block type="led_ctrl">
      <field name="TGT">OUT1</field>
      <field name="MODE">BRIGHT</field>
      <field name="VAL">10</field>
    </block>
  </category>
  <category name="제어" colour="#10b981">
    <block type="controls_repeat_ext">
      <value name="TIMES">
        <shadow type="math_number"><field name="NUM">3</field></shadow>
      </value>
    </block>
    <block type="wait_seconds">
      <value name="SEC">
        <shadow type="math_number"><field name="NUM">1</field></shadow>
      </value>
    </block>
  </category>
</xml>

<!-- 전체화면 오버레이 (카메라 전체 화면) -->
<div id="playOverlay" aria-hidden="true">
  <div class="body">
    <video id="eyesCam" playsinline muted autoplay></video>
    <div id="ovRight" class="ov-right-panel">
      <div class="ov-header">실행 로그</div>
      <div id="ovLog" class="ov-log"></div>
    </div>
    <div id="eyesStage"></div>
    <div id="overlayDigitBadge">
      <span class="label">숫자</span>
      <span class="value">—</span>
    </div>
  </div>
</div>

<script>
/* ===== Blockly 기본 설정 ===== */
class XroboZelosProvider extends Blockly.zelos.ConstantProvider {
  constructor(){
    super();
    this.ADD_START_HATS = true;
  }
}
class XroboZelosRenderer extends Blockly.zelos.Renderer {
  constructor(){ super('xrobo_zelos'); }
  makeConstants_(){ return new XroboZelosProvider(); }
}
Blockly.blockRendering.register('xrobo_zelos', XroboZelosRenderer);

const XroboTheme = Blockly.Theme.defineTheme('xrobo_theme', {
  base: Blockly.Themes.Zelos,
  componentStyles: { startHats:true }
});

var ws = Blockly.inject('blocklyDiv', {
  toolbox: document.getElementById('toolbox'),
  renderer: 'xrobo_zelos',
  theme: XroboTheme,
  grid: { spacing:20, length:3, colour:'#eee', snap:true },
  zoom: { controls:true, wheel:true, startScale:1, minScale:0.5, maxScale:2 },
  move: { scrollbars:true, drag:true, wheel:true },
  trashcan:true
});

/* Blockly v12 경고 제거용 SHIM */
(function(){
  try{
    if(Blockly.Workspace &&
       Blockly.Workspace.prototype &&
       Blockly.Workspace.prototype.getAllVariables){
      Blockly.Workspace.prototype.getAllVariables = function(){
        var vm = this.getVariableMap ? this.getVariableMap() : null;
        return (vm && vm.getAllVariables) ? vm.getAllVariables() : [];
      };
    }
  }catch(e){}
})();

/* 드래그 중 자동 스크롤 방지 */
(function(){
  try{
    if(Blockly.BlockDragger && Blockly.BlockDragger.prototype){
      var orig = Blockly.BlockDragger.prototype.updateDrag;
      if(typeof orig === 'function'){
        Blockly.BlockDragger.prototype.updateDrag = function(e){
          var saved = this.autoScroll_;
          this.autoScroll_ = null;
          var r = orig.call(this, e);
          this.autoScroll_ = saved;
          return r;
        };
      }
    }
  }catch(e){}
})();

/* ===== 공통 상수 ===== */
var PINS_OUT=[["OUT1","OUT1"],["OUT2","OUT2"],["OUT3","OUT3"],["OUT4","OUT4"],
              ["OUT5","OUT5"],["OUT6","OUT6"],["OUT7","OUT7"],["OUT8","OUT8"]];
var SPEEDS   = Array.from({length:41},(_,i)=>20-i).map(v=>[String(v),String(v)]);
var TIMES100 = Array.from({length:10},(_,i)=>100*(i+1)).map(v=>[String(v),String(v)]);
var LED_TGT  = [].concat(PINS_OUT,[["CPU","CPU"]]);
var LED_MODE = [["밝기","BRIGHT"],["숨쉬기","BREATHE"]];
var LED_VALS = Array.from({length:20},(_,i)=>[String(i),String(i)]);

/* ===== 블록 정의 ===== */
const DIGIT_OPTIONS = Array.from({length:10},(_,i)=>[String(i),'D'+i]);

Blockly.defineBlocksWithJsonArray([
  {
    "type":"xrobo_start",
    "message0":"숫자 %1 이 보이면",
    "args0":[{"type":"field_dropdown","name":"DIGIT","options":DIGIT_OPTIONS}],
    "nextStatement":null,"colour":36,"hat":"cap"
  },
  {
    "type":"motor12_dd",
    "message0":"모터 M1 %1  M2 %2  시간 %3 ms",
    "args0":[
      {"type":"field_dropdown","name":"M1","options":SPEEDS},

/* ===== 코드 빌더 ===== */
function numFromInput(parent,name,def){
  if(def===void 0) def=0;
  var raw = Blockly.JavaScript.valueToCode(parent,name,Blockly.JavaScript.ORDER_NONE);
  var n = Number(raw != null ? raw : '');
  return (isFinite(n)?n:def);
}
function walkNode(b,list){
  if(!b) return;
  switch(b.type){
    case 'motor12_dd':{
      var v1=+b.getFieldValue('M1');
      var v2=+b.getFieldValue('M2');
      var ms=+b.getFieldValue('MS');
      list.push({type:'CMD',s:`M12 ${v1} ${v2} ${ms}`});
      if(ms>0) list.push({type:'W',args:[ms]});
      break;
    }
    case 'motor12_in':{
      var v1n=numFromInput(b,'M1',0);
      var v2n=numFromInput(b,'M2',0);
      var msn=numFromInput(b,'MS',0);
      list.push({type:'CMD',s:`M12 ${Math.round(v1n)} ${Math.round(v2n)} ${Math.round(msn)}`});
      if(msn>0) list.push({type:'W',args:[msn]});
      break;
    }
    case 'melody':{
      var p=b.getFieldValue('PITCH');
      var dur=numFromInput(b,'DUR',200);
      var wait=numFromInput(b,'WAIT',0);
      list.push({type:'CMD',s:`MEL ${p} ${Math.round(dur)} ${Math.round(wait)}`});
      if(wait>0) list.push({type:'W',args:[wait]});
      break;
    }
    case 'led_ctrl':{
      var t=b.getFieldValue('TGT');
      var m=b.getFieldValue('MODE');
      var v=+b.getFieldValue('VAL');
      list.push({type:'CMD',s:`LED ${t} ${m} ${v}`});
      break;
    }
    case 'controls_repeat_ext':{
      var times=Math.max(0,numFromInput(b,'TIMES',1));
      var inner=[]; var first=b.getInputTargetBlock('DO');
      walkChain(first,inner);
      list.push({type:'FOR',count:times,body:inner});
      break;
    }
    case 'wait_seconds':{
      var s=numFromInput(b,'SEC',1);
      if(s>0) list.push({type:'W',args:[s*1000]});
      break;
    }
  }
}
function walkChain(start,list){
  for(var n=start;n;n=n.getNextBlock()) walkNode(n,list);
}
function normalizeProgram(list){
  var out=[];
  for(var i=0;i<list.length;i++){
    var ins=list[i];
    if(ins.type==='CMD'){
      var prev=out[out.length-1];
      if(prev && prev.type==='CMD' && prev.s===ins.s) continue;
    }else if(ins.type==='W'){
      if(!isFinite(ins.args && ins.args[0]) || ins.args[0]<=0) continue;
      var prevw=out[out.length-1];
      if(prevw && prevw.type==='W'){
        prevw.args[0]+=ins.args[0];
        continue;
      }
    }
    out.push(ins);
  }
  return out;
}
function buildEventPrograms(){
  const programs={D0:[],D1:[],D2:[],D3:[],D4:[],D5:[],D6:[],D7:[],D8:[],D9:[]};
  var evs = ws.getBlocksByType('xrobo_start',true);
  for(var i=0;i<evs.length;i++){
    var code = evs[i].getFieldValue('DIGIT') || 'D0';
    var chain = evs[i].getNextBlock(); if(!chain) continue;
    var prog=[]; walkChain(chain,prog);
    var norm = normalizeProgram(prog);
    programs[code] = programs[code].concat(norm);
  }
  return programs;
}

function connectBLE(){
  if(!navigator.bluetooth){
    alert('이 브라우저는 Web Bluetooth 미지원입니다.');
    return;
  }
  (async()=>{
    try{
      var dev = await navigator.bluetooth.requestDevice({
        filters:[{namePrefix:'XROBO'}],
        optionalServices:[SERVICE_UUID,0xFFF3,0xFFF4]
      });
      try{
        if(bleDevice && bleDevice.removeEventListener){
          bleDevice.removeEventListener('gattserverdisconnected',onDisconnected);
        }
      }catch(e){}
      resetBleRefs();
      bleDevice=dev;
      if(bleDevice && bleDevice.addEventListener){
        bleDevice.addEventListener('gattserverdisconnected',onDisconnected);
      }
      bleServer=await bleDevice.gatt.connect();
      bleService=await bleServer.getPrimaryService(SERVICE_UUID);

      try{writeChar=await bleService.getCharacteristic(0xFFF3);}catch(e){}
      try{notifyChar=await bleService.getCharacteristic(0xFFF4);}catch(e){}
      if(!writeChar || notifyChar==null){
        var cs=await bleService.getCharacteristics();
        for(var i=0;i<cs.length;i++){
          var ch=cs[i],p=ch.properties||{};
          if(!writeChar && (p.write||p.writeWithoutResponse)) writeChar=ch;
          if(!notifyChar && p.notify) notifyChar=ch;
        }
      }
      if(!writeChar) throw new Error('write 특성을 찾지 못했습니다.');
      if(notifyChar){
        await notifyChar.startNotifications();
        if(notifyChar.addEventListener){
          notifyChar.addEventListener('characteristicvaluechanged',ev=>{
            try{
              var v=new TextDecoder().decode(ev.target.value||new Uint8Array());
              log('⬅️ '+v.trim());
            }catch(e){}
          });
        }
      }
      setConnected(true);
      log('✅ 연결: '+(dev.name||'(이름 없음)'));
    }catch(e){
      console.error(e);
      log('❌ 연결 실패: '+e);
      setConnected(false);
      resetBleRefs();
    }
  })();
}
function onDisconnected(){
  log('🔌 해제됨');
  setConnected(false);
  resetBleRefs();
}
function disconnectBLE(){
  try{ if(bleDevice && bleDevice.gatt) bleDevice.gatt.disconnect(); }catch(e){}
  setConnected(false);
  resetBleRefs();
}
btnConnect.onclick=()=>isConnected?disconnectBLE():connectBLE();

/* ===== 오른쪽 패널(로그 높이 조절) ===== */
(function(){
  var divider=document.getElementById('rightDivider');
  var root=document.documentElement;
  var dragging=false,startY=0,startH=0,rightH=0;
  function pxToNum(px){return Number(String(px).replace('px',''))||0;}
  function onDown(e){
    e.preventDefault();
    dragging=true;
    startY=('touches' in e ? e.touches[0].clientY : e.clientY);
    startH=pxToNum(getComputedStyle(root).getPropertyValue('--logH'));
    rightH=document.getElementById('right').clientHeight;
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('mouseup',onUp,{once:true});
    window.addEventListener('touchend',onUp,{once:true});
  }
  function onMove(e){
    if(!dragging) return;
    var y=('touches' in e ? e.touches[0].clientY : e.clientY);
    if('touches' in e) e.preventDefault();
    var delta=startY-y;
    var nh=startH+delta;
    var minH=90,maxH=Math.max(130,Math.floor(rightH*0.8));
    nh=Math.min(maxH,Math.max(minH,nh));
    root.style.setProperty('--logH',nh+'px');
  }
  function onUp(){
    dragging=false;
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('touchmove',onMove);
  }
  divider.addEventListener('mousedown',onDown);
  divider.addEventListener('touchstart',onDown,{passive:false});
})();

var overlay=document.getElementById('playOverlay');

var queue=[];
var queueBusy=false;
var cancelToken=0;

function sendRaw(s){
  if(!writeChar){
    log('➡️(BLE 미연결) '+s);
    return Promise.resolve();
  }
  return writeChar.writeValue(enc(s+"\n")).then(()=>{
    log('➡️ '+s);
  }).catch(e=>{
    log('⚠️ 전송 실패: '+e);
  });
}
async function runList(list,localToken){
  for(var i=0;i<list.length;i++){
    var ins=list[i];
    if(localToken!==cancelToken) return;
    if(ins.type==='CMD'){
      await sendRaw(ins.s);
    }else if(ins.type==='W'){
      var ms=(ins.args && ins.args[0])?ins.args[0]:0;
      await new Promise(r=>setTimeout(r,ms));
    }else if(ins.type==='FOR'){
      for(var k=0;k<ins.count;k++){
        if(localToken!==cancelToken) return;
        await runList(ins.body,localToken);
      }
    }
  }
}
async function processQueue(localToken){
  if(queueBusy) return;
  queueBusy=true;
  try{
    while(queue.length && localToken===cancelToken){
      var item=queue.shift();
      await runList(item.list,localToken);
    }
  }finally{
    queueBusy=false;
  }
}
function triggerEvent(name){
  if(!isRunning) return;
  var seq=eventPrograms[name];
  if(seq && seq.length){
    queue.push({list:seq});
    var myToken=cancelToken;
    processQueue(myToken);
  }
}

async function ensureOcr(){

    }catch(_e){
      ocrWorker=Tesseract.createWorker({logger:m=>{}});

      });
    }

function getRoiRectFromFocus(video,fracW=0.45,fracH=0.45){
  const vw=Math.max(1,video.videoWidth||320);
  const vh=Math.max(1,video.videoHeight||240);
  const cx=Math.round((1-fx)*(vw-1));
  const cy=Math.round(fy*(vh-1));
  const rw=Math.round(vw*fracW);
  const rh=Math.round(vh*fracH);
  const x0=Math.max(0,Math.min(vw-rw,cx-Math.floor(rw/2)));
  const y0=Math.max(0,Math.min(vh-rh,cy-Math.floor(rh/2)));
  return {x:x0,y:y0,w:rw,h:rh,vw,vh};
}

function preprocessToOcrCanvas(video,rect){
  ocrCtx.drawImage(video,rect.x,rect.y,rect.w,rect.h,0,0,OCR_W,OCR_H);
  const img=ocrCtx.getImageData(0,0,OCR_W,OCR_H);
  const d=img.data;
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const g=toGray(d[i],d[i+1],d[i+2]);
    d[i]=d[i+1]=d[i+2]=g;
    sum+=g;
  }
  const mean=sum/(OCR_W*OCR_H);
  const th=Math.max(60,Math.min(220,mean-12));
  for(let i=0;i<d.length;i+=4){
    const v=d[i]<th?0:255;
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=255;
  }
  ocrCtx.putImageData(img,0,0);
  return {mean};
}

async function runOcrOnVideo(video,fullFrame=false){
  if(!ocrReady || ocrBusy) return null;
  const now=performance.now();
  if(now-ocrLastTs<OCR_INTERVAL_MS) return null;
  ocrLastTs=now;
  const rect=fullFrame
    ? {x:0,y:0,w:Math.max(1,video.videoWidth||320),h:Math.max(1,video.videoHeight||240)}
    : getRoiRectFromFocus(video);
  const {mean}=preprocessToOcrCanvas(video,rect);
  if(!fullFrame && mean<BG_MIN_MEAN) return null;

  try{
    ocrBusy=true;
    const res=await ocrWorker.recognize(ocrCvs);
    let bestDigit=null,bestConf=-1;
    if(res && res.data && res.data.symbols && res.data.symbols.length){
      for(const s of res.data.symbols){
        const ch=(s.text||'').trim();
        if(/^[0-9]$/.test(ch)){
          if(s.confidence>bestConf){
            bestConf=s.confidence;
            bestDigit=ch;
          }
        }
      }
    }
    if(!bestDigit && res && res.data && typeof res.data.text==='string'){
      const m=res.data.text.match(/[0-9]/);
      if(m){
        bestDigit=m[0];
        bestConf=(res.data.confidence||0);
      }
    }
    ocrBusy=false;
    if(bestDigit!=null && bestConf>=OCR_MIN_CONF){
      return {digit:bestDigit,conf:bestConf|0};
    }
  }catch(e){
    ocrBusy=false;
  }
  return null;
}

/* 패널 감지 루프: 숫자 상태가 바뀔 때만 로그/이벤트 */
function startDetectLoop(){
  const step=async()=>{
    const runOcr=!isFullscreenRun;

    if(!camOn || camVideo.readyState<2){
      camRAF=requestAnimationFrame(step);
      return;
    }

    procCtx.drawImage(camVideo,0,0,LOW_W,LOW_H);
    const frame=procCtx.getImageData(0,0,LOW_W,LOW_H);
    const data=frame.data;

    if(!step.prevGray) step.prevGray=new Uint8ClampedArray(LOW_W*LOW_H);
    let mass=0,sx=0,sy=0;

    for(let y=0,i=0,p=0;y<LOW_H;y++){
      for(let x=0;x<LOW_W;x++,i++){
        const r=data[p++],g=data[p++],b=data[p++];p++;
        const gray=toGray(r,g,b);
        const d=Math.abs(gray-step.prevGray[i]);
        step.prevGray[i]=gray;
        if(d>0){
          sx+=x*d;
          sy+=y*d;
          mass+=d;
        }
      }
    }

    if(mass>MASS_MIN){
      const cx=sx/mass,cy=sy/mass;
      fxT=1-(cx/(LOW_W-1));
      fyT=(cy/(LOW_H-1));
    }

    fx+=(fxT-fx)*FOCUS_LERP;
    fy+=(fyT-fy)*FOCUS_LERP;

    if(runOcr){
      const out=await runOcrOnVideo(camVideo);
      const now=performance.now();
      let frameDigit=null;
      let frameConf=null;
      if(out && out.digit!=null){
        frameDigit=String(out.digit);
        frameConf=out.conf;
      }

      if(candDigit!==frameDigit){
        candDigit=frameDigit;
        candSince=now;
      }

      if((now-candSince)>=OCR_HOLD_MS && activeDigit!==frameDigit){
        activeDigit=frameDigit;
        activeDigitConf=frameConf;
        updateDigitReadout(activeDigit);

        if(activeDigit!=null){
          const confStr=(typeof activeDigitConf==='number')
            ? activeDigitConf.toFixed(1)
            : '?';
          log(`number : ${activeDigit} ${confStr}%`);
          log('🎯 숫자 감지(ROI): '+activeDigit+' (이벤트 실행)');
          triggerEvent('D'+activeDigit);
        }else{
          log('number : 숫자 없음');
          log('◽ 숫자 없음');
        }
      }
    }

    camRAF=requestAnimationFrame(step);
  };
  camRAF=requestAnimationFrame(step);
}

(function(){
  var res=document.getElementById('hResizer');
  var main=document.getElementById('main');
  var right=document.getElementById('right');
  if(!res||!main||!right) return;

  var dragging=false,startX=0,startW=0,rafId=0,maxW=0;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function computeMax(){
    var rect=main.getBoundingClientRect();
    var barW=res.getBoundingClientRect().width||8;
    maxW=Math.max(0,rect.width-barW);
    return maxW;
  }
  function onDown(clientX){
    dragging=true;
    startX=clientX;
    startW=right.getBoundingClientRect().width;
    computeMax();
    document.body.classList.add('hs-resizing');
  }
  function applyWidth(newW){
    newW=clamp(newW,0,maxW);
    document.documentElement.style.setProperty('--rightW',newW+'px');
    cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(()=>{
      try{
        if(window.Blockly && typeof Blockly.svgResize==='function' && window.ws){
          Blockly.svgResize(ws);
        }
      }catch(e){}
    });
  }
  function onMove(clientX){
    if(!dragging) return;
    var dx=clientX-startX;
    var newW=startW-dx;
    applyWidth(newW);
  }
  function onUp(){
    dragging=false;
    document.body.classList.remove('hs-resizing');
  }
  res.addEventListener('mousedown',e=>{
    e.preventDefault();
    onDown(e.clientX);
  });
  window.addEventListener('mousemove',e=>onMove(e.clientX));
  window.addEventListener('mouseup',onUp);

  res.addEventListener('touchstart',e=>{
    if(!e.touches||!e.touches[0]) return;
    e.preventDefault();
    onDown(e.touches[0].clientX);
  },{passive:false});
  window.addEventListener('touchmove',e=>{
    if(!e.touches||!e.touches[0]) return;
    onMove(e.touches[0].clientX);
  },{passive:false});
  window.addEventListener('touchend',onUp);

  document.body.classList.remove('panel-collapsed');

  window.addEventListener('resize',()=>{
    var cur=right.getBoundingClientRect().width;
    var mx=computeMax();
    if(cur>mx) applyWidth(mx);
  });
})();

        return true;
      }
      wrap('showEditor_') || wrap('showEditor');
      Blockly.FieldNumber.__xrobo_v14=true;
    }catch(_){}
  }

  function patchFieldTextInput(){
    try{
      if(!window.Blockly || !Blockly.FieldTextInput || Blockly.FieldTextInput.__xrobo_v14) return;
      const proto=Blockly.FieldTextInput.prototype;
      const origShow=proto.showEditor_;
      proto.showEditor_=function(opt_e){
        const rv=origShow ? origShow.apply(this,arguments) : undefined;
        if(typeof Blockly.FieldNumber!=='undefined' && this instanceof Blockly.FieldNumber){
          const self=this;
          setTimeout(()=>afterEditorOpened(self),0);
        }
        return rv;
      };
      const origPrompt=proto.showPromptEditor_;
      if(typeof origPrompt==='function'){
        proto.showPromptEditor_=function(){
          if(typeof Blockly.FieldNumber!=='undefined' && this instanceof Blockly.FieldNumber){
            openForPrompt(this.getValue?this.getValue():'',lastAnchor);
            return;
          }
          return origPrompt.apply(this,arguments);
        };
      }
      Blockly.FieldTextInput.__xrobo_v14=true;
    }catch(_){}
  }

  function patchPrompt(){
    try{
      if(!window.Blockly) return;
      const numLike=v=>/^[\s]*[+\-]?\d+(?:[\s]*[+\-*/][\s]*[+\-]?\d+)*[\s]*$/
                           .test(String(v||''));
      if(Blockly.dialog && typeof Blockly.dialog.setPrompt==='function' &&
         !Blockly.dialog.__xrobo_v14){
        Blockly.dialog.setPrompt(function(msg,defVal,cb){
          const looksNumeric =
            numLike(defVal) || /value|값|number|숫자/i.test(String(msg||''));
          if(looksNumeric){
            promptCallback=v=>{try{cb(v);}catch(_){};};
            openForPrompt(defVal,lastAnchor);
          }else{
            const ans=window.prompt(String(msg||''),String(defVal||''));
            try{cb(ans);}catch(_){}
          }
        });
        Blockly.dialog.__xrobo_v14=true;
      }else if(!Blockly.__xrobo_prompt_v14){
        const old=Blockly.prompt;
        Blockly.prompt=function(message,defaultValue,callback){
          const looksNumeric =
            numLike(defaultValue) ||
            /value|값|number|숫자/i.test(String(message||''));
          if(looksNumeric){
            promptCallback=v=>{try{callback(v);}catch(_){};};
            openForPrompt(defaultValue,lastAnchor);
          }else{
            return old ? old.apply(this,arguments)
                       : window.prompt(message,defaultValue);
          }
        };
        Blockly.__xrobo_prompt_v14=true;
      }
    }catch(_){}
  }

  document.addEventListener('focusin',e=>{
    const t=e.target;
    if(!t) return;
    if(t.classList &&
       (t.classList.contains('blocklyHtmlInput') ||
        t.classList.contains('blocklyHtmlTextInput'))){
      openForInput(t,null);
      const onBlur=()=>{
        try{commit();}catch(_){cancel();}
        t.removeEventListener('blur',onBlur);
      };
      t.addEventListener('blur',onBlur);
    }
  },true);

  (function(){
    const root=document.getElementById('blocklyDiv')||document.body;
    const savePt=e=>{lastAnchor={x:e.clientX,y:e.clientY};};
    if(hasPointer) root.addEventListener('pointerdown',savePt,true);
    else{
      root.addEventListener('mousedown',savePt,true);
      root.addEventListener('touchstart',e=>{
        if(e.touches&&e.touches[0])
          lastAnchor={x:e.touches[0].clientX,y:e.touches[0].clientY};
      },{capture:true,passive:true});
    }
  })();

  function tryPatch(){
    patchFieldNumber();
    patchFieldTextInput();
    patchPrompt();
  }
  if(document.readyState==='complete' || document.readyState==='interactive'){
    tryPatch();
  }else{
    window.addEventListener('DOMContentLoaded',tryPatch);
  }
  let tries=0;
  const iv=setInterval(()=>{
    tryPatch();
    if(++tries>12) clearInterval(iv);
  },300);
})();
</script>
</body>
